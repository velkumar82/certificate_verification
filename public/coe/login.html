<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COE Login — Certificate Verification Portal</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark" style="background: linear-gradient(135deg, #2b3a42, #1f4e5f);">COE</div>
    <div>
      Certificate Verification Portal
      <span class="sub">Controller of Examinations</span>
    </div>
  </div>
</div>

<div class="container-narrow">
  <div class="card">
    <div class="card-header">
      <h2>COE Login</h2>
      <p>Sign in with your Controller of Examinations credentials</p>
    </div>

    <div id="alert-box"></div>

    <form id="coe-login-form">
      <div class="field">
        <label for="user_id">COE User ID</label>
        <input type="text" id="user_id" name="user_id" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign In</button>
    </form>
  </div>
  <p class="footer-note">Authorized verifier access only. All activity is logged.</p>
</div>

<script src="/js/common.js"></script>
<script src="/js/coe/login.js"></script>
</body>
</html>
