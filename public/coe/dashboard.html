<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COE Dashboard — Certificate Verification Portal</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark" style="background: linear-gradient(135deg, #2b3a42, #1f4e5f);">COE</div>
    <div>
      COE Dashboard
      <span class="sub" id="welcome-name">Verifier</span>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-secondary btn-sm" id="logout-btn">Log Out</button>
  </div>
</div>

<div class="container">
  <div class="page-header">
    <div>
      <h1>Verification Requests</h1>
      <p>Click a Register Number to open Request For Education Details</p>
    </div>
  </div>

  <div id="alert-box"></div>

  <div class="stat-row" id="stat-row"></div>

  <div class="nav-tabs" id="status-tabs">
    <button data-status="active" class="active">Pending &amp; In Review</button>
    <button data-status="Verified">Verified</button>
    <button data-status="Rejected">Rejected</button>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table id="requests-table">
        <thead>
          <tr>
            <th>Register No.</th>
            <th>Applicant Name</th>
            <th>Organization</th>
            <th>Year of Passing</th>
            <th>Submitted</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="requests-tbody"></tbody>
      </table>
    </div>
    <div id="empty-state" class="empty-state hidden">
      <div class="icon">✅</div>
      <h3>Nothing here</h3>
      <p>No requests currently match this filter.</p>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/coe/dashboard.js"></script>
</body>
</html>
