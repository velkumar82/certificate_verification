<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Certificate Verification Portal</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">CV</div>
    <div>
      Certificate Verification Portal
      <span class="sub">Applicant Access</span>
    </div>
  </div>
  <div class="topbar-actions">
    <a href="/index.html">Sign In</a>
  </div>
</div>

<div class="container-narrow">
  <div class="card">
    <div class="card-header">
      <h2>Create your account</h2>
      <p>Register to submit a certificate verification request</p>
    </div>

    <div id="alert-box"></div>

    <form id="register-form">
      <div class="field">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="Optional">
      </div>
      <div class="field">
        <label for="organization_name">Organization Name *</label>
        <input type="text" id="organization_name" name="organization_name" required placeholder="e.g. Your company or institution name">
      </div>
      <div class="field">
        <label for="organization_website">Organization Website</label>
        <input type="text" id="organization_website" name="organization_website" placeholder="Optional — e.g. https://example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        <div class="hint">Minimum 8 characters</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Account</button>
    </form>

    <p style="text-align:center; margin-top:18px; font-size:13.5px;">
      Already registered? <a href="/index.html">Sign in</a>
    </p>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/register.js"></script>
</body>
</html>
